<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#5A2E12">

  <title>PeribahasaAR - Bagaimana Acuan, Begitulah Kuihnya</title>

  <!-- Sama seperti peribahasa pertama: A-Frame dan MindAR (percuma) -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --kayu: #5A2E12;
      --kayu-muda: #8B5A2B;
      --emas: #C9962B;
      --emas-cerah: #F2C760;
      --krim: #FFF7E8;
      --hijau: #1F6B4F;
      --teks: #3B2412;
      --bayang: 0 4px 16px rgba(40, 20, 5, 0.40);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--teks);
      -webkit-tap-highlight-color: transparent;
    }

    #ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
    #ui button { pointer-events: auto; }

    #status {
      position: absolute;
      top: calc(10px + env(safe-area-inset-top));
      left: 10px;
      max-width: calc(100% - 140px);
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 247, 232, 0.94);
      border: 2px solid var(--emas);
      box-shadow: var(--bayang);
      font-size: 13px;
      line-height: 1.25;
      font-weight: 600;
      color: var(--hijau);
    }
    body.target-found #status { display: none; }

    /* Penunjuk babak */
    #atas {
      position: absolute;
      top: calc(18px + env(safe-area-inset-top));
      left: 12px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    body.target-found #atas { display: flex; }
    #dots { display: flex; gap: 6px; }
    #dots i {
      width: 9px; height: 9px; border-radius: 50%;
      background: rgba(255, 247, 232, 0.45);
      border: 1px solid rgba(90, 46, 18, 0.6);
      transition: background 0.3s, transform 0.3s;
    }
    #dots i.aktif { background: var(--emas-cerah); transform: scale(1.25); }

    #kawalan {
      position: absolute;
      top: calc(8px + env(safe-area-inset-top));
      right: 8px;
      display: none;
      gap: 8px;
    }
    body.target-found #kawalan { display: flex; }
    .bulat {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 2px solid var(--emas);
      background: rgba(90, 46, 18, 0.88);
      color: var(--emas-cerah);
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      cursor: pointer;
      box-shadow: var(--bayang);
      touch-action: manipulation;
    }
    .bulat svg { width: 24px; height: 24px; fill: currentColor; }
    .bulat:active { transform: scale(0.94); }
    .bulat[hidden] { display: none; }

    .besar {
      min-height: 54px;
      padding: 0 18px;
      border-radius: 16px;
      border: 3px solid var(--emas-cerah);
      background: var(--kayu);
      color: var(--emas-cerah);
      font-family: inherit;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.2px;
      box-shadow: var(--bayang), inset 0 -3px 0 rgba(0, 0, 0, 0.25);
      cursor: pointer;
      touch-action: manipulation;
    }
    .besar:active { transform: scale(0.97); }
    .besar.hijau { background: var(--hijau); color: #fff; border-color: #fff; }
    .besar.cerah { background: var(--krim); color: var(--kayu); border-color: var(--kayu-muda); }
    .besar:disabled { opacity: 0.35; }
    .besar[hidden] { display: none; }

    /* Bahagian bawah: disusun dalam satu lajur supaya tidak bertindih */
    #bawah {
      position: absolute;
      left: 10px; right: 10px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #btn-mula {
      min-width: 190px;
      min-height: 62px;
      font-size: 24px;
      display: none;
      animation: denyut 1.6s ease-in-out infinite;
    }
    @keyframes denyut {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    #aksi {
      display: none;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    #nav {
      display: none;
      width: 100%;
      max-width: 560px;
      gap: 10px;
    }
    #nav .besar { flex: 1; padding: 0 10px; }
    #btn-restart { font-size: 16px; line-height: 1.15; }
    #sari {
      width: 100%;
      max-width: 560px;
      min-height: 54px;
      padding: 10px 16px;
      border-radius: 16px;
      background: rgba(58, 30, 12, 0.90);
      border: 2px solid var(--emas);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      box-shadow: var(--bayang);
      display: none;
      align-items: center;
      justify-content: center;
    }
    #sari.ada { animation: sariMasuk 0.35s ease both; }
    @keyframes sariMasuk {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #toast {
      position: absolute;
      left: 50%;
      top: 40%;
      transform: translateX(-50%);
      max-width: 82%;
      padding: 12px 18px;
      border-radius: 14px;
      background: rgba(255, 247, 232, 0.97);
      border: 2px solid var(--emas);
      box-shadow: var(--bayang);
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      opacity: 0;
      transition: opacity 0.25s;
    }
    #toast.papar { opacity: 1; }

    body.target-found #sari.ada { display: flex; }
    body.target-found #aksi.ada { display: flex; }
    body.target-found #nav.ada { display: flex; }
    body.target-found #btn-mula.ada { display: block; }

    @media (prefers-reduced-motion: reduce) {
      #btn-mula { animation: none; }
      #sari.ada { animation: none; }
    }
    @media (max-height: 600px) {
      #sari { font-size: 16px; min-height: 46px; padding: 7px 12px; }
      .besar { min-height: 50px; font-size: 16px; }
    }
  </style>
</head>

<body>

  <!-- ===================== ANTARA MUKA (HTML) ===================== -->
  <div id="ui">
    <div id="status">Acuan: sedang memulakan kamera...</div>

    <div id="atas">
      <div id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <div id="kawalan">
      <button id="btn-jeda" class="bulat" type="button" aria-label="Jeda atau main" hidden></button>
      <button id="btn-ulang" class="bulat" type="button" aria-label="Main semula" hidden>
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
      <button id="btn-bisu" class="bulat" type="button" aria-label="Senyap atau bunyi"></button>
    </div>

    <div id="bawah">
      <button id="btn-mula" class="besar" type="button">Mula &#9654;</button>

      <div id="aksi">
        <button id="btn-kembali" class="besar cerah" type="button" hidden>&#8592; Kembali</button>
        <button id="btn-kuiz" class="besar hijau" type="button" hidden>Teruskan ke Kuiz</button>
      </div>

      <div id="nav">
        <button id="btn-prev" class="besar cerah" type="button">&#8249; Sebelumnya</button>
        <button id="btn-next" class="besar" type="button">Seterusnya &#8250;</button>
        <button id="btn-restart" class="besar" type="button" hidden>&#8634; Belajar semula</button>
      </div>

      <div id="sari" role="status" aria-live="polite"></div>
    </div>
    <div id="toast"></div>
  </div>

  <!-- ================================================================
       ADEGAN AR - tetapan MindAR sama seperti peribahasa pertama.
       Fail sasaran: ./targets-baharu.mind, dikompil daripada gambar-acuan.png
       (lukisan baharu). targets.mind yang lama dikekalkan tetapi tidak digunakan.
       ================================================================ -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets-baharu.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Ilustrasi = 1 x 1 unit. Tengah (0,0); kiri -0.5; kanan 0.5; atas 0.5; bawah -0.5.
         Kandungan cerita dibina oleh JavaScript di dalam #dunia. -->
    <a-entity id="sasaran" mindar-image-target="targetIndex: 0">
      <a-entity id="dunia"></a-entity>
    </a-entity>
  </a-scene>

  <script>
  (function () {
    'use strict';

    // Cerita dibina selepas adegan A-Frame siap dimuatkan
    const adegan = document.querySelector('a-scene');
    if (adegan.hasLoaded) { mulakan(); }
    else { adegan.addEventListener('loaded', mulakan, { once: true }); }

    function mulakan() {

    /* ==================================================================
       1. TETAPAN YANG BOLEH ANDA UBAH
       ================================================================== */

    // Tampal pautan kuiz/laman kamus anda di antara tanda petik, contohnya:
    // const KUIZ_URL = 'https://nama-anda.github.io/kuiz/';
    const KUIZ_URL = '../?hal=19';   // terus ke halaman Kuiz dalam buku (buku berada satu tahap di atas folder ini)

    const AUDIO_DIR = 'audio/';

    // Klip narasi (suara Osman). "fail" = nama fail sebenar dalam folder audio.
    // "sari" (pilihan) = sari kata pendek yang dipaparkan apabila klip dimainkan.
    const KLIP = {
      b1:     { fail: 'b1-narasi.mp3' },     // Babak 1 (14.8 s)
      b2:     { fail: 'b2-narasi.mp3' },     // Babak 2, pengenalan objek (12.5 s)
      b3:     { fail: 'b3-narasi.mp3' },     // Babak 3, cerita acuan (13.4 s)
      b4:     { fail: 'b4-narasi.mp3' },     // Babak 4, maksud (24.2 s)
      acuan:  { fail: 'objek-acuan.mp3',  sari: 'Alat untuk membentuk kuih.' },
      adunan: { fail: 'objek-adunan.mp3', sari: 'Bahan lembut yang dibentuk.' },
      kuih:   { fail: 'objek-kuih.mp3',   sari: 'Mengikut bentuk acuan.' },
      penutup:{ fail: 'penutup.mp3',      sari: 'Teladan yang baik membentuk peribadi yang baik.' }
    };

    // Objek Babak 2: kedudukan pin, kotak ketik/serlah dan label.
    // [x, y] = tengah kotak; [w, h] = saiz kotak. Ilustrasi: -0.5 hingga 0.5.
    const OBJEK = {
      acuan:  { nama: 'Acuan',  no: 1, pin: [-0.13, 0.01],  kotak: [-0.13, 0.03, 0.40, 0.27], label: [-0.13, 0.25], z: 0.030 },
      adunan: { nama: 'Adunan', no: 2, pin: [0.20, 0.08],   kotak: [0.203, 0.07, 0.24, 0.17],  label: [0.20, 0.26],  z: 0.032 },
      kuih:   { nama: 'Kuih',   no: 3, pin: [0.14, -0.10],  kotak: [0.093, -0.16, 0.37, 0.23], label: [0.09, -0.35], z: 0.034 }
    };

    /* ==================================================================
       2. ALAT ASAS
       ================================================================== */
    const $ = (id) => document.getElementById(id);
    const sceneEl = adegan;
    const sasaran = $('sasaran');
    const dunia = $('dunia');
    const D2R = Math.PI / 180;
    const lerp = (a, b, u) => a + (b - a) * u;

    function bahan(c, extra) {
      const m = { shader: 'flat', color: c, side: 'double' };
      if (extra) {
        extra.split(';').forEach(function (kv) {
          const p = kv.split(':');
          if (p.length < 2) return;
          const v = p[1].trim();
          m[p[0].trim()] = (v === 'true') ? true : (v === 'false') ? false : (isNaN(v) ? v : Number(v));
        });
      }
      return m;
    }
    function pos(e, x, y, z) { e.setAttribute('position', x + ' ' + y + ' ' + (z || 0)); }
    function G(parent, x, y, z) {
      const e = document.createElement('a-entity');
      pos(e, x, y, z); parent.appendChild(e); return e;
    }
    function R(parent, x, y, w, h, c, z, rot, extra) {
      const e = document.createElement('a-plane');
      e.setAttribute('width', w); e.setAttribute('height', h);
      e.setAttribute('material', bahan(c, extra));
      pos(e, x, y, z);
      if (rot) e.setAttribute('rotation', '0 0 ' + rot);
      parent.appendChild(e); return e;
    }
    function C(parent, x, y, r, c, z, extra, tStart, tLen) {
      const e = document.createElement('a-circle');
      e.setAttribute('radius', r); e.setAttribute('segments', 28);
      if (tStart !== undefined) { e.setAttribute('theta-start', tStart); e.setAttribute('theta-length', tLen); }
      e.setAttribute('material', bahan(c, extra));
      pos(e, x, y, z); parent.appendChild(e); return e;
    }
    function RG(parent, x, y, ri, ro, c, z) {
      const e = document.createElement('a-ring');
      e.setAttribute('radius-inner', ri); e.setAttribute('radius-outer', ro);
      e.setAttribute('segments-theta', 32);
      e.setAttribute('material', bahan(c, 'transparent: true'));
      pos(e, x, y, z); parent.appendChild(e); return e;
    }
    function TX(parent, value, x, y, w, c, z, wrap) {
      const e = document.createElement('a-text');
      e.setAttribute('value', value); e.setAttribute('align', 'center');
      e.setAttribute('width', w); e.setAttribute('color', c);
      e.setAttribute('wrap-count', wrap || value.length + 2);
      pos(e, x, y, z); parent.appendChild(e); return e;
    }
    function denyut(e, prop, a, b, dur) {
      e.setAttribute('animation__d', 'property: ' + prop + '; from: ' + a + '; to: ' + b +
        '; dur: ' + dur + '; dir: alternate; loop: true; easing: easeInOutSine');
    }
    function bintang(parent, x, y, s, c, z) {
      const g = G(parent, x, y, z);
      R(g, 0, 0, s, s * 0.28, c, 0);
      R(g, 0, 0, s * 0.28, s, c, 0.001);
      R(g, 0, 0, s * 0.7, s * 0.2, c, 0.002, 45);
      R(g, 0, 0, s * 0.7, s * 0.2, c, 0.003, -45);
      return g;
    }
    // Corak bunga pada acuan/kuih: cincin + lapan kelopak + tengah
    function bunga(parent, x, y, r, warna, z) {
      const g = G(parent, x, y, z);
      RG(g, 0, 0, r * 0.92, r, warna, 0);
      for (let i = 0; i < 8; i++) {
        const k = G(g, 0, 0, 0.001);
        k.setAttribute('rotation', '0 0 ' + (i * 45));
        const e = C(k, r * 0.55, 0, r * 0.26, warna, 0);
        e.setAttribute('scale', '1.5 0.55 1');
      }
      C(g, 0, 0, r * 0.17, warna, 0.002);
      return g;
    }

    /* ==================================================================
       3. ENJIN LINI MASA (nilai ditentukan oleh masa "t")
       ================================================================== */
    function sample(k, t, lin, step) {
      const n = k.length;
      if (t <= k[0][0]) return k[0].slice(1);
      if (t >= k[n - 1][0]) return k[n - 1].slice(1);
      let i = 0;
      while (k[i + 1][0] < t) i++;
      const a = k[i], b = k[i + 1];
      if (step) return a.slice(1);
      let u = (t - a[0]) / (b[0] - a[0]);
      if (!lin) u = u * u * (3 - 2 * u);
      return a.slice(1).map((v, j) => lerp(v, b[j + 1], u));
    }
    const tr = (set, k, o) => ({ set: set, k: k, lin: !!(o && o.lin), step: !!(o && o.step) });
    const tPos = (e, k, o) => tr((v) => { e.object3D.position.x = v[0]; e.object3D.position.y = v[1]; }, k, o);
    const tRot = (e, k, o) => tr((v) => { e.object3D.rotation.z = v[0] * D2R; }, k, o);
    const tScl = (e, k, o) => tr((v) => { e.object3D.scale.set(v[0], v.length > 1 ? v[1] : Math.abs(v[0]), 1); }, k, o);
    const tVis = (e, k) => tr((v) => { e.object3D.visible = v[0] > 0.5; }, k, { step: true });
    const tNum = (obj, key, k, o) => tr((v) => { obj[key] = v[0]; }, k, o);

    /* ==================================================================
       4. WATAK KARTUN
       ================================================================== */
    function buatWatak(parent, o) {
      const g = G(parent, 0, 0, 0);
      const ch = { g: g, st: { walk: 0, arm: 0, armW: 0 } };
      C(g, 0, 0.004, 0.07, '#000000', -0.003, 'transparent: true; opacity: 0.22').setAttribute('scale', '1 0.25 1');

      ch.armB = G(g, 0, 0.205, 0.002);
      R(ch.armB, 0, -0.055, 0.03, 0.11, o.bajuGelap, 0);
      C(ch.armB, 0, -0.12, 0.02, o.kulit, 0.001);

      ch.legB = G(g, -0.02, 0.105, 0.004);
      R(ch.legB, 0, -0.05, 0.036, 0.1, o.seluar, 0);
      R(ch.legB, 0.012, -0.098, 0.056, 0.022, o.kasut, 0.001);

      R(g, 0, 0.158, 0.1, 0.12, o.baju, 0.006);
      R(g, 0, 0.108, 0.1, 0.03, o.seluar, 0.0065);

      ch.legF = G(g, 0.02, 0.105, 0.008);
      R(ch.legF, 0, -0.05, 0.036, 0.1, o.seluar, 0);
      R(ch.legF, 0.012, -0.098, 0.056, 0.022, o.kasut, 0.001);

      ch.head = G(g, 0, 0.258, 0.010);
      C(ch.head, 0, 0, 0.047, o.kulit, 0);
      R(ch.head, 0, 0.043, 0.085, 0.034, o.topi, 0.002);
      C(ch.head, 0.022, 0.004, 0.007, '#2B1A0E', 0.004);

      ch.armF = G(g, 0, 0.205, 0.014);
      R(ch.armF, 0, -0.055, 0.034, 0.11, o.baju, 0);
      C(ch.armF, 0, -0.12, 0.021, o.kulit, 0.001);
      return ch;
    }
    function aturWatak(ch, t) {
      const s = ch.st;
      const sw = Math.sin(t * 9) * 0.6 * s.walk;
      ch.legF.object3D.rotation.z = sw;
      ch.legB.object3D.rotation.z = -sw;
      ch.armB.object3D.rotation.z = -sw * 0.9;
      ch.armF.object3D.rotation.z = lerp(sw * 0.9, s.arm * D2R, s.armW);
      ch.g.object3D.position.y += Math.abs(Math.sin(t * 9)) * 0.008 * s.walk;
    }

    /* ==================================================================
       5. MEMBINA KANDUNGAN AR
       ================================================================== */
    const GR = {};   // kumpulan peringkat
    const HL = {};   // serlahan objek
    const HIT = {};  // kotak ketik

    // Kedudukan benda dalam ilustrasi (diukur daripada gambar)
    const A = [-0.129, 0.007];       // pusat acuan
    const BWL = [0.203, 0.085];      // pusat mangkuk adunan
    const KUIH = [0.093, -0.159];    // pusat tiga kuih
    const K = [-0.27, -0.26];        // tempat kuih baharu diletakkan
    const HIJAU = '#8CC152';

    // ---------- (a) Babak 1: tajuk + cincin ----------
    const I = {};
    (function () {
      const g = GR.intro = G(dunia, 0, 0, 0.06);
      I.ban = G(g, 0, 0.38, 0);
      const ap = G(I.ban, 0, 0, 0);
      R(ap, 0, 0, 0.84, 0.21, '#C9962B', 0);
      R(ap, 0, 0, 0.81, 0.185, '#5A2E12', 0.002);
      R(ap, 0, 0.083, 0.81, 0.011, '#C9962B', 0.003);
      R(ap, 0, -0.083, 0.81, 0.011, '#C9962B', 0.003);
      TX(ap, 'Bagaimana Acuan,\nBegitulah Kuihnya', 0, 0, 0.70, '#F2C760', 0.006, 18);
      ap.setAttribute('animation__f', 'property: position; from: 0 0 0; to: 0 0.015 0; dur: 1600; dir: alternate; loop: true; easing: easeInOutSine');

      I.r1 = RG(g, A[0], A[1], 0.20, 0.215, '#F2C760', 0.01);
      I.r1.setAttribute('scale', '1 0.8 1');
      denyut(I.r1, 'material.opacity', 1, 0.3, 500);
      I.r2 = RG(g, KUIH[0], KUIH[1], 0.21, 0.225, '#F2C760', 0.01);
      I.r2.setAttribute('scale', '1.05 0.7 1');
      denyut(I.r2, 'material.opacity', 1, 0.3, 500);
    })();

    // ---------- (b) Babak 2: pin, kotak ketik, serlahan ----------
    (function () {
      const g = GR.objek = G(dunia, 0, 0, 0.05);
      Object.keys(OBJEK).forEach(function (key) {
        const o = OBJEK[key];
        const pin = G(g, o.pin[0], o.pin[1], 0.01);
        const gelang = RG(pin, 0, 0, 0.040, 0.050, '#F2C760', 0);
        gelang.setAttribute('animation__s', 'property: scale; from: 1 1 1; to: 1.7 1.7 1; dur: 1300; loop: true');
        gelang.setAttribute('animation__o', 'property: material.opacity; from: 0.9; to: 0; dur: 1300; loop: true');
        C(pin, 0, 0, 0.040, '#FFFFFF', 0.002);
        C(pin, 0, 0, 0.032, '#C9962B', 0.004);
        TX(pin, String(o.no), 0, 0, 0.2, '#FFFFFF', 0.007, 10);
        o.pinEl = pin;

        const hb = R(g, o.kotak[0], o.kotak[1], o.kotak[2], o.kotak[3], '#000000', o.z,
                     0, 'transparent: true; opacity: 0; depthWrite: false');
        HIT[key] = hb;

        const h = HL[key] = G(dunia, 0, 0, 0.08);
        const cx = o.kotak[0], cy = o.kotak[1], w = o.kotak[2], ht = o.kotak[3], t = 0.014;

    const IKON_JEDA = '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
    const IKON_MAIN = '<svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg>';
    const IKON_BUNYI = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>';
    const IKON_SENYAP = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M15 9.5l6 5M21 9.5l-6 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';

    function tunjuk(id, ya) { $(id).hidden = !ya; }
    function kemasUI() {
      const st = S.stage;
      $('btn-mula').className = 'besar' + (!S.started ? ' ada' : '');
      tunjuk('btn-jeda', S.started);
      tunjuk('btn-ulang', S.started);
      $('btn-jeda').innerHTML = S.paused ? IKON_MAIN : IKON_JEDA;
      $('btn-bisu').innerHTML = S.muted ? IKON_SENYAP : IKON_BUNYI;
      // navigasi lima babak
      $('nav').className = S.started ? 'ada' : '';
      $('btn-prev').disabled = (st === 1);
      tunjuk('btn-next', st < 5);
      tunjuk('btn-restart', st === 5);
      // butang tindakan
      tunjuk('btn-kembali', st === 2 && !!S.obj);
      tunjuk('btn-kuiz', st === 5);
      $('aksi').className = ((st === 2 && S.obj) || st === 5) && S.started ? 'ada' : '';
      // penunjuk babak
      const dots = $('dots').children;
      for (let i = 0; i < dots.length; i++) dots[i].className = (i < st) ? 'aktif' : '';
    }

    let pemasaToast = null;
    function toast(teks) {
      const t = $('toast');
      t.textContent = teks; t.className = 'papar';
      clearTimeout(pemasaToast);
      pemasaToast = setTimeout(function () { t.className = ''; }, 2600);
    }

    $('btn-mula').addEventListener('click', function () {
      // Audio hanya bermula selepas ketikan ini (syarat iPhone & Android)
      S.started = true; S.paused = false;
      keBabak(1);
    });
    $('btn-next').addEventListener('click', function () { S.paused = false; keBabak(S.stage + 1); });
    $('btn-prev').addEventListener('click', function () { S.paused = false; keBabak(S.stage - 1); });
    $('btn-restart').addEventListener('click', function () { S.paused = false; keBabak(1); });
    $('btn-jeda').addEventListener('click', function () {
      S.paused = !S.paused;
      segerakAudio(); kemasUI();
    });
    $('btn-bisu').addEventListener('click', function () {
      S.muted = !S.muted;
      narator.muted = S.muted; kemasUI();
    });
    $('btn-ulang').addEventListener('click', function () {
      S.paused = false;
      if (S.stage === 2 && S.obj) { mainKlip(S.obj); }
      else { keBabak(S.stage); }
      kemasUI();
    });
    $('btn-kembali').addEventListener('click', kembaliDariObjek);
    $('btn-kuiz').addEventListener('click', function () {
      if (KUIZ_URL) { window.location.href = KUIZ_URL; }
      else { toast('Pautan kuiz belum ditetapkan. Lihat KUIZ_URL dalam index.html.'); }
    });

    /* ==================================================================
       9. PENJEJAKAN IMEJ (sama seperti peribahasa pertama)
       ================================================================== */
    const elStatus = $('status');
    let pemasaHilang = null;

    sasaran.addEventListener('targetFound', function () {
      clearTimeout(pemasaHilang);
      S.found = true;
      S.autoPaused = false;
      document.body.classList.add('target-found');
      elStatus.textContent = 'Ilustrasi berjaya dikesan!';
      segerakAudio();
    });
    sasaran.addEventListener('targetLost', function () {
      S.found = false;
      S.autoPaused = true;                // cerita & audio dijeda
      segerakAudio();
      elStatus.textContent = 'Cari semula ilustrasi anda. Cerita akan disambung.';
      clearTimeout(pemasaHilang);
      pemasaHilang = setTimeout(function () {
        document.body.classList.remove('target-found');
      }, 700);
    });
    sceneEl.addEventListener('arReady', function () {
      elStatus.textContent = 'Kamera sedia. Halakan ke gambar acuan dan kuih.';
    });
    sceneEl.addEventListener('arError', function () {
      elStatus.textContent = 'Kamera tidak dapat dibuka. Sila benarkan akses kamera, kemudian muat semula halaman.';
    });
    // Semak fail sasaran: jika tiada di folder ini, beritahu dengan jelas
    fetch('./targets-baharu.mind', { method: 'HEAD', cache: 'no-store' }).then(function (r) {
      if (!r.ok) elStatus.textContent = 'Fail targets-baharu.mind tidak ditemui dalam folder acuan. Sila muat naik fail ini.';
    }).catch(function () { /* tiada rangkaian: biarkan mesej biasa */ });

    /* ==================================================================
       10. GELUNG ANIMASI
       ================================================================== */
    let akhir = performance.now();
    function gelung(now) {
      requestAnimationFrame(gelung);
      const dt = Math.min((now - akhir) / 1000, 0.1);
      akhir = now;

      const st = ST[S.stage];
      if (running() && !S.tamat) {
        S.t += dt;
        while (S.cueI < st.cues.length && S.t >= st.cues[S.cueI][0]) {
          mainKlip(st.cues[S.cueI][1]); S.cueI++;
        }
        while (S.subI < st.subs.length && S.t >= st.subs[S.subI][0]) {
          if (!S.obj) sari(st.subs[S.subI][1]);
          S.subI++;
        }
        if (S.t >= st.dur) { S.t = st.dur; S.tamat = true; }
      }
      lukis();
    }
    function lukis() {
      const st = ST[S.stage];
      for (const nama in GR) GR[nama].object3D.visible = st.show.indexOf(nama) >= 0;
      for (const k in HL) HL[k].object3D.visible = (S.stage === 2 && S.obj === k);
      for (const k in OBJEK) OBJEK[k].pinEl.object3D.visible = !(S.stage === 2 && S.obj === k);
      st.tracks.forEach(function (tk) { tk.set(sample(tk.k, S.t, tk.lin, tk.step)); });
      if (st.post) st.post(S.t);
    }

    sari('Tekan Mula untuk bermula.');
    kemasUI();
    requestAnimationFrame(gelung);
    }   // akhir mulakan()
  })();
  </script>

</body>
</html>
